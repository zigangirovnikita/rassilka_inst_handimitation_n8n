name: Windows Release

on:
  push:
    branches: [main]
    paths:
      - .github/release-v0.2.2
  workflow_dispatch:
    inputs:
      release_tag:
        description: GitHub release tag to attach the installer to
        required: true
        default: v0.2.2

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.3.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check source
        run: pnpm check

      - name: Run tests
        run: pnpm test

      - name: Build frontend
        run: pnpm build

      - name: Build Windows installer
        shell: pwsh
        run: |
          pnpm run build:windows 2>&1 | Tee-Object windows-build.log
          if ($LASTEXITCODE -ne 0) {
            $tail = (Get-Content windows-build.log -Tail 30) -join "%0A"
            Write-Output "::error title=Windows installer build failed::$tail"
            exit $LASTEXITCODE
          }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: Instagram-Agent-n8n-windows-x64
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: error

      - name: Attach installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || 'v0.2.2' }}
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          fail_on_unmatched_files: true
          overwrite_files: true
